<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stick Control">
<meta name="theme-color" content="#14060a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Stick Control</title>
<style>
  :root {
    --wine: #a3202e;
    --wine-soft: rgba(163, 32, 46, 0.55);
    --ochre: #d9a633;
    --ochre-soft: rgba(217, 166, 51, 0.55);
    --text: #fff2e0;
    --dim: rgba(255, 242, 224, 0.45);
    --faint: rgba(255, 242, 224, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 35%, #2a0b12 0%, #14060a 60%, #0b0306 100%);
    color: var(--text);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-appearance: none; appearance: none; }

  #app {
    height: 100dvh;
    max-width: 900px;
    margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
  }

  /* Kopfzeile: nur Nummer */
  .pattern-btn {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 8px 14px; margin-top: 4px;
    font-size: 1.6rem; font-weight: 600; color: var(--dim);
  }
  .pattern-btn b { font-size: 2.2rem; font-weight: 800; color: var(--ochre); }
  .pattern-btn .caret { font-size: 0.8rem; }

  /* Sticking */
  .sticking { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; transition: opacity .25s; }
  .sticking.fade { opacity: 0; }
  .sticking.hidden { display: none; }
  .bar { display: flex; gap: clamp(4px, 1.2vw, 12px); }
  .grp { display: flex; gap: clamp(2px, 0.8vw, 8px); margin: 0 clamp(6px, 2vw, 18px); }
  .n {
    width: clamp(28px, 6.5vw, 54px);
    text-align: center;
    font-size: clamp(1.6rem, 5.5vw, 3rem);
    font-weight: 800;
    line-height: 1.25;
    transition: transform .07s, color .07s;
    position: relative;
  }
  .n.R { color: var(--ochre-soft); }
  .n.L { color: var(--wine-soft); }
  .n.on.R { color: var(--ochre); transform: scale(1.08); }
  .n.on.L { color: #e0414f; transform: scale(1.08); }
  .n::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: transparent;
  }
  .n.on::after { background: var(--text); }

  /* Notation (gleicher Platz wie .sticking) */
  .notation { width: 100%; max-width: 680px; margin-top: 10px; overflow-x: auto; display: none; }
  .notation.show { display: block; }
  .notation svg { width: 100%; height: auto; }

  /* Tap-Zone (mittlerer Bereich = Play/Pause) */
  .tap-zone {
    flex: 1; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 0;
    cursor: pointer;
  }

  /* Wiederholung */
  .rep-num {
    font-size: clamp(8rem, 38vmin, 24rem);
    font-weight: 800; line-height: 0.95;
    color: var(--ochre);
    font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  .rep-num.bump { transform: scale(1.06); }
  .rep-of { font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 700; color: var(--dim); }

  /* Optionen — nur Icons */
  .opts { display: flex; gap: 14px; margin-bottom: 8px; }
  .opt {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    color: var(--dim);
  }
  .opt.on { color: var(--ochre); }
  .opt svg { width: 22px; height: 22px; }
  .opt-label { font-size: 0.85rem; font-weight: 800; }

  /* Tempo */
  .tempo { display: flex; align-items: center; gap: clamp(16px, 5vw, 40px); }
  .round {
    width: 60px; height: 60px; border-radius: 50%;
    border: 2px solid var(--faint);
    display: flex; align-items: center; justify-content: center;
  }
  .round svg { width: 24px; height: 24px; }
  .round:active { transform: scale(.92); border-color: var(--wine); }
  .bpm { text-align: center; min-width: 130px; padding: 4px 8px; }
  .bpm-v { font-size: 3.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .bpm-l { font-size: .75rem; font-weight: 600; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }

  /* Transport */
  .transport { display: flex; align-items: center; gap: 36px; margin-top: 16px; }
  .icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .icon svg { width: 26px; height: 26px; }
  .play {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--wine); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 0 rgba(163,32,46,.7);
    transition: box-shadow .12s, transform .08s;
  }
  .play:active { transform: scale(.95); }
  .play svg { width: 34px; height: 34px; }
  .play.pulse { box-shadow: 0 0 0 14px rgba(163,32,46,0); animation: pulse .35s ease-out; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(217,166,51,.6); } to { box-shadow: 0 0 0 18px rgba(217,166,51,0); } }

  .hint { min-height: 1.2em; margin-top: 8px; font-size: .8rem; color: var(--dim); text-align: center; }

  /* Overlays */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 10; }
  .ov.show { display: flex; }
  #presetOv { align-items: center; justify-content: center; }
  .presets { background: #24100f; border-radius: 22px; padding: 18px; width: 290px; }
  .presets h3, .sheet h3 { font-size: 1rem; text-align: center; margin-bottom: 12px; color: var(--dim); letter-spacing: 1px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pbtn { padding: 14px 0; border-radius: 999px; background: rgba(255,255,255,.07); font-size: 1.15rem; font-weight: 700; }
  .pbtn.on { background: var(--wine); }

  #pickOv { align-items: flex-end; justify-content: center; }
  .sheet {
    background: #1c0b0e; width: 100%; max-width: 700px; max-height: 78dvh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheet-head h3 { margin: 0; }
  .done { color: var(--ochre); font-weight: 700; padding: 6px 10px; }
  .plist { list-style: none; }
  .pitem {
    display: flex; align-items: center; gap: 14px; padding: 12px 10px;
    border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer;
  }
  .pitem:last-child { border-bottom: none; }
  .pitem .no { width: 44px; font-weight: 800; color: var(--dim); font-size: 1.1rem; }
  .pitem.sel .no { color: var(--ochre); }
  .pitem .st { font-weight: 800; letter-spacing: 1px; font-size: clamp(0.8rem, 2.6vw, 1.05rem); white-space: nowrap; }
  .st .r { color: var(--ochre); } .st .l { color: #d4434f; }
  .st .gap { display: inline-block; width: 10px; }
</style>
</head>
<body>
<div id="app">
  <button class="pattern-btn" id="patBtn" aria-label="Muster wählen">
    <b id="patNo">1</b> / 24 <span class="caret">▼</span>
  </button>

  <div class="sticking" id="sticking"></div>
  <div class="notation" id="notation"></div>

  <div class="tap-zone" id="tapZone">
    <div class="rep-num" id="repNum">1</div>
    <div class="rep-of">/ 20</div>
  </div>

  <div class="opts">
    <button class="opt" id="modeBtn" aria-label="Reihenfolge/Zufällig"></button>
    <button class="opt" id="subBtn" aria-label="Metronom Achtel/Viertel"></button>
    <button class="opt" id="notaBtn" aria-label="Notation/Buchstaben"></button>
  </div>

  <div class="tempo">
    <button class="round" id="minus" aria-label="langsamer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="bpm" id="bpmBtn" aria-label="Tempo-Voreinstellungen">
      <div class="bpm-v" id="bpmV">100</div>
      <div class="bpm-l">BPM</div>
    </button>
    <button class="round" id="plus" aria-label="schneller">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="transport">
    <span class="icon"></span>
    <button class="play" id="play" aria-label="Start"></button>
    <button class="icon" id="reset" aria-label="Zurücksetzen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div class="ov" id="presetOv">
  <div class="presets">
    <h3>TEMPO</h3>
    <div class="pgrid" id="pgrid"></div>
  </div>
</div>

<div class="ov" id="pickOv">
  <div class="sheet">
    <div class="sheet-head"><span style="width:60px"></span><h3>MUSTER WÄHLEN</h3><button class="done" id="pickDone">Fertig</button></div>
    <ul class="plist" id="plist"></ul>
  </div>
</div>

<script>
"use strict";
const EX = [
  "RLRLRLRLRLRLRLRL", "LRLRLRLRLRLRLRLR", "RRLLRRLLRRLLRRLL", "LLRRLLRRLLRRLLRR",
  "RLRRLRLLRLRRLRLL", "RLLRLRRLRLLRLRRL", "RRLRLLRLRRLRLLRL", "RLRLLRLRRLRLLRLR",
  "RRRLRRRLRRRLRRRL", "LLLRLLLRLLLRLLLR", "RLLLRLLLRLLLRLLL", "LRRRLRRRLRRRLRRR",
  "RRRRLLLLRRRRLLLL", "RLRLRRLLRLRLRRLL", "LRLRLLRRLRLRLLRR", "RLRLRLRRLRLRLRLL",
  "RLRLRLLRLRLRLRRL", "RLRLRRLRLRLRLLRL", "RLRLRRRLRLRLRRRL", "LRLRLLLRLRLRLLLR",
  "RLRLRLLLRLRLRLLL", "LRLRLRRRLRLRLRRR", "RLRLRRRRLRLRLLLL", "RRLLRLRRLLRRLRLL"
];
const REPS = 20, STEPS = 16, PRESETS = [80, 85, 90, 95, 100, 105, 110, 115, 120];

const saved = (() => { try { return JSON.parse(localStorage.getItem("sc") || "{}"); } catch (e) { return {}; } })();
let bpm = saved.bpm || 100;
let randomMode = !!saved.random;
let eighthClick = saved.eighth !== undefined ? !!saved.eighth : true;
let showNotation = !!saved.nota;
let highlightOn = saved.hl !== undefined ? !!saved.hl : true;
let pat = Number.isInteger(saved.pat) ? saved.pat : 0;
let rep = 0, playing = false;
let played = new Set([pat]);
function save() { try { localStorage.setItem("sc", JSON.stringify({ bpm, random: randomMode, eighth: eighthClick, pat, nota: showNotation, hl: highlightOn })); } catch (e) {} }

// ─── AUDIO ───
let ctx = null, master = null, clickHi = null, clickLo = null, clickAcc = null, silentEl = null;

function makeSilentWavURL() {
  const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

function renderClick(freq, dur, gain, noiseAmt) {
  const sr = ctx.sampleRate, len = Math.floor(sr * dur);
  const b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    const env = Math.exp(-t * 60);
    const attack = Math.min(1, i / (sr * 0.0015));
    const tone = Math.sin(2 * Math.PI * freq * t) + 0.35 * Math.sin(2 * Math.PI * freq * 2.01 * t);
    const noise = (Math.random() * 2 - 1) * Math.exp(-t * 300) * noiseAmt;
    d[i] = gain * attack * env * (tone * 0.75 + noise);
  }
  return b;
}

function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  if (!silentEl) {
    silentEl = document.createElement("audio");
    silentEl.setAttribute("playsinline", "");
    silentEl.setAttribute("x-webkit-airplay", "deny");
    silentEl.loop = true; silentEl.preload = "auto";
    silentEl.src = makeSilentWavURL();
  }
  const p = silentEl.play(); if (p && p.catch) p.catch(() => {});
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { hint("Dieser Browser unterstützt kein Web Audio."); return; }
    ctx = new AC({ latencyHint: "interactive" });
    master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
    clickAcc = renderClick(1650, 0.06, 0.95, 0.6);
    clickHi  = renderClick(1100, 0.05, 0.75, 0.5);
    clickLo  = renderClick(1100, 0.05, 0.30, 0.3);
    ctx.onstatechange = () => { if (playing && ctx.state !== "running") hint("Ton unterbrochen – tippe auf Stop und wieder Start."); };
  }
  const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
  if (ctx.state !== "running") ctx.resume().catch(() => {});
}

function playBuf(buf, when) {
  const s = ctx.createBufferSource(); s.buffer = buf; s.connect(master); s.start(when);
}

// ─── Scheduler ───
let nextTime = 0, sStep = 0, sRep = 0, sPat = 0, timer = null, queue = [];
const LOOKAHEAD = 0.15;

function nextPattern(cur) {
  if (!randomMode) return (cur + 1) % EX.length;
  if (played.size >= EX.length) played = new Set();
  const avail = []; for (let i = 0; i < EX.length; i++) if (!played.has(i) && i !== cur) avail.push(i);
  const n = avail.length ? avail[Math.floor(Math.random() * avail.length)] : (cur + 1) % EX.length;
  played.add(n); return n;
}

function schedule() {
  if (!ctx) return;
  while (nextTime < ctx.currentTime + LOOKAHEAD) {
    const isQuarter = sStep % 4 === 0;
    const isEighth  = sStep % 2 === 0;
    const isFirst   = sStep === 0;
    // Letzte Wiederholung (Nr. 20): Akzent auf jede Viertel
    const isLastRep = sRep === REPS - 1;
    if (isFirst && !isLastRep) playBuf(clickAcc, nextTime);
    else if (isQuarter && isLastRep) playBuf(clickAcc, nextTime);
    else if (isQuarter) playBuf(clickHi, nextTime);
    else if (eighthClick && isEighth) playBuf(clickLo, nextTime);
    queue.push({ t: nextTime, step: sStep, rep: sRep, pat: sPat });
    nextTime += 60 / bpm / 4;
    sStep++;
    if (sStep >= STEPS) {
      sStep = 0; sRep++;
      if (sRep >= REPS) { sRep = 0; sPat = nextPattern(sPat); }
    }
  }
}

let shownStep = -1;
function draw() {
  if (playing && ctx) {
    const now = ctx.currentTime;
    let cur = null;
    while (queue.length && queue[0].t <= now) cur = queue.shift();
    if (cur) {
      if (cur.pat !== pat) { pat = cur.pat; rep = cur.rep; renderPattern(true); save(); }
      if (cur.rep !== rep) { rep = cur.rep; renderRep(true); }
      setActive(cur.step);
      if (cur.step === 0) pulse();
    }
    requestAnimationFrame(draw);
  }
}

function start() {
  unlockAudio();
  if (!ctx) return;
  playing = true;
  sPat = pat; sRep = rep; sStep = 0; queue = [];
  played = new Set([pat]);
  const go = () => {
    if (!playing) return;
    nextTime = ctx.currentTime + 0.08;
    schedule();
    clearInterval(timer); timer = setInterval(schedule, 25);
    requestAnimationFrame(draw);
    setTimeout(() => {
      if (playing && ctx.state !== "running") hint("Kein Ton? Lautstärke prüfen und erneut auf Start tippen.");
    }, 600);
  };
  if (ctx.state === "running") go(); else ctx.resume().then(go, go);
  hint(""); renderPlay(); keepAwake(true);
}

function stop() {
  playing = false;
  clearInterval(timer); timer = null; queue = [];
  setActive(-1); renderPlay(); keepAwake(false);
}

function jumpTo(i) {
  pat = i; rep = 0; played = new Set([i]);
  if (playing && ctx) { sPat = i; sRep = 0; sStep = 0; queue = []; nextTime = ctx.currentTime + 0.06; }
  renderPattern(true); renderRep(); save();
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && playing) {
    keepAwake(true);
    if (ctx && ctx.state !== "running") ctx.resume().catch(() => {});
  }
});

// ─── UI ───
const $ = id => document.getElementById(id);
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>';
const ICON_SHUF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>';
const ICON_SEQ  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M14 6l6 6-6 6"/></svg>';
const ICON_8TH  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="8" cy="18" rx="3.5" ry="3" fill="currentColor" stroke="none"/><line x1="11.5" y1="18" x2="11.5" y2="4"/><path d="M11.5 4c3 0 5 2 5 4s-2 4-5 4"/></svg>';
const ICON_4TH  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="10" cy="18" rx="3.5" ry="3" fill="currentColor" stroke="none"/><line x1="13.5" y1="18" x2="13.5" y2="4"/></svg>';
const ICON_STAFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="16" x2="22" y2="16"/><circle cx="8" cy="14" r="2" fill="currentColor" stroke="none"/><path d="M10 14V6"/><circle cx="18" cy="14" r="2" fill="currentColor" stroke="none"/><path d="M20 14V6"/></svg>';

let noteEls = [];
function renderPattern(animate) {
  const box = $("sticking");
  const build = () => {
    box.innerHTML = ""; noteEls = [];
    const s = EX[pat];
    for (let b = 0; b < 2; b++) {
      const bar = document.createElement("div"); bar.className = "bar";
      for (let g = 0; g < 2; g++) {
        const grp = document.createElement("div"); grp.className = "grp";
        for (let k = 0; k < 4; k++) {
          const idx = b * 8 + g * 4 + k;
          const el = document.createElement("span"); el.className = "n " + s[idx]; el.textContent = s[idx];
          grp.appendChild(el); noteEls[idx] = el;
        }
        bar.appendChild(grp);
      }
      box.appendChild(bar);
    }
    $("patNo").textContent = pat + 1;
    shownStep = -1;
  };
  if (animate) { box.classList.add("fade"); setTimeout(() => { build(); box.classList.remove("fade"); renderView(); }, 120); }
  else { build(); renderView(); }
}

function setActive(step) {
  if (shownStep === step) return;
  if (noteEls[shownStep]) noteEls[shownStep].classList.remove("on");
  if (noteEls[step] && highlightOn && !showNotation) noteEls[step].classList.add("on");
  shownStep = step;
}

function renderRep(bump) {
  const el = $("repNum"); el.textContent = rep + 1;
  if (bump) { el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 120); }
}
function renderPlay() { $("play").innerHTML = playing ? ICON_STOP : ICON_PLAY; }
function renderBpm() { $("bpmV").textContent = bpm; }
function renderOpts() {
  $("modeBtn").innerHTML = randomMode ? ICON_SHUF : ICON_SEQ;
  $("modeBtn").classList.toggle("on", randomMode);
  $("subBtn").innerHTML = eighthClick ? ICON_8TH : ICON_4TH;
  $("subBtn").classList.toggle("on", eighthClick);
  $("notaBtn").innerHTML = showNotation ? ICON_STAFF : '<span class="opt-label">R/L</span>';
  $("notaBtn").classList.toggle("on", showNotation);
}
function pulse() { const p = $("play"); p.classList.remove("pulse"); void p.offsetWidth; p.classList.add("pulse"); }
function hint(t) { $("hint").textContent = t; }
function setBpm(v) { bpm = Math.max(30, Math.min(240, v)); renderBpm(); save(); }

function renderView() {
  $("sticking").classList.toggle("hidden", showNotation);
  $("notation").classList.toggle("show", showNotation);
  if (showNotation) renderNotation();
}

function renderNotation() {
  const box = $("notation");
  if (!showNotation) return;
  const s = EX[pat];
  const W = 640, H = 100, ML = 30, MR = 10;
  const usable = W - ML - MR;
  const sp = usable / 16;
  const staffY = [28, 36, 44, 52, 60];
  const noteY = 44;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  staffY.forEach(y => { svg += `<line x1="${ML-6}" y1="${y}" x2="${W-MR}" y2="${y}" stroke="rgba(255,242,224,0.2)" stroke-width="1"/>`; });
  const barX = ML + sp * 8;
  svg += `<line x1="${barX}" y1="${staffY[0]}" x2="${barX}" y2="${staffY[4]}" stroke="rgba(255,242,224,0.3)" stroke-width="1.5"/>`;
  svg += `<line x1="${W-MR}" y1="${staffY[0]}" x2="${W-MR}" y2="${staffY[4]}" stroke="rgba(255,242,224,0.3)" stroke-width="1.5"/>`;
  svg += `<line x1="${ML-6}" y1="${staffY[0]}" x2="${ML-6}" y2="${staffY[4]}" stroke="rgba(255,242,224,0.3)" stroke-width="1.5"/>`;
  for (let i = 0; i < 16; i++) {
    const x = ML + sp * i + sp / 2;
    const isR = s[i] === 'R';
    const col = isR ? '#d9a633' : '#a3202e';
    svg += `<ellipse cx="${x}" cy="${noteY}" rx="5" ry="3.8" fill="${col}" transform="rotate(-15 ${x} ${noteY})"/>`;
    svg += `<line x1="${x+4.5}" y1="${noteY-2}" x2="${x+4.5}" y2="${noteY - 26}" stroke="${col}" stroke-width="1.5"/>`;
    svg += `<text x="${x}" y="${staffY[4] + 16}" text-anchor="middle" fill="${col}" font-size="11" font-weight="800" font-family="ui-rounded, system-ui, sans-serif">${s[i]}</text>`;
  }
  for (let g = 0; g < 4; g++) {
    const i0 = g * 4, i3 = g * 4 + 3;
    const x0 = ML + sp * i0 + sp / 2 + 4.5;
    const x3 = ML + sp * i3 + sp / 2 + 4.5;
    const by = noteY - 26;
    svg += `<line x1="${x0}" y1="${by}" x2="${x3}" y2="${by}" stroke="rgba(255,242,224,0.7)" stroke-width="2.5"/>`;
  }
  svg += '</svg>';
  box.innerHTML = svg;
}

// ─── Events ───
$("play").addEventListener("click", () => { playing ? stop() : start(); });
$("reset").addEventListener("click", () => { stop(); jumpTo(0); });

// Tap-Zone: play/pause by tapping the middle area
$("tapZone").addEventListener("click", e => {
  if (e.target.closest('button')) return; // don't interfere with buttons
  unlockAudio();
  playing ? stop() : start();
});

// Highlight toggle: tap on sticking letters
$("sticking").addEventListener("click", () => {
  highlightOn = !highlightOn;
  save();
  if (!highlightOn && noteEls[shownStep]) noteEls[shownStep].classList.remove("on");
  if (highlightOn && playing && noteEls[shownStep]) noteEls[shownStep].classList.add("on");
});

function holdable(el, delta) {
  let t1 = null, t2 = null;
  const down = e => { e.preventDefault(); unlockAudio(); setBpm(bpm + delta); t1 = setTimeout(() => { t2 = setInterval(() => setBpm(bpm + delta), 70); }, 420); };
  const up = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  el.addEventListener("pointerdown", down);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, up));
}
holdable($("minus"), -1); holdable($("plus"), 1);

function openPresets() {
  const g = $("pgrid"); g.innerHTML = "";
  PRESETS.forEach(p => {
    const b = document.createElement("button"); b.className = "pbtn" + (p === bpm ? " on" : ""); b.textContent = p;
    b.addEventListener("click", () => { setBpm(p); $("presetOv").classList.remove("show"); });
    g.appendChild(b);
  });
  $("presetOv").classList.add("show");
}
$("bpmBtn").addEventListener("click", openPresets);
$("presetOv").addEventListener("click", e => { if (e.target.id === "presetOv") e.currentTarget.classList.remove("show"); });

$("modeBtn").addEventListener("click", () => { randomMode = !randomMode; played = new Set([pat]); renderOpts(); save(); });
$("subBtn").addEventListener("click", () => { eighthClick = !eighthClick; renderOpts(); save(); });
$("notaBtn").addEventListener("click", () => { showNotation = !showNotation; renderOpts(); renderView(); save(); });

function openPicker() {
  const ul = $("plist"); ul.innerHTML = "";
  EX.forEach((s, i) => {
    const li = document.createElement("li"); li.className = "pitem" + (i === pat ? " sel" : "");
    let st = "";
    for (let k = 0; k < 16; k++) { if (k === 8) st += '<span class="gap"></span><span class="gap"></span>'; else if (k % 4 === 0 && k) st += '<span class="gap"></span>'; st += '<span class="' + (s[k] === "R" ? "r" : "l") + '">' + s[k] + "</span>"; }
    li.innerHTML = '<span class="no">' + (i + 1) + '</span><span class="st">' + st + "</span>";
    li.addEventListener("click", () => { jumpTo(i); $("pickOv").classList.remove("show"); });
    ul.appendChild(li);
  });
  $("pickOv").classList.add("show");
  const sel = ul.querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "center" });
}
$("patBtn").addEventListener("click", openPicker);
$("pickDone").addEventListener("click", () => $("pickOv").classList.remove("show"));
$("pickOv").addEventListener("click", e => { if (e.target.id === "pickOv") e.currentTarget.classList.remove("show"); });

document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playing ? stop() : start(); } });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

renderPattern(false); renderRep(); renderBpm(); renderOpts(); renderPlay();
</script>
</body>
</html>
